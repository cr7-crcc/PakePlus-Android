<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>坦克大战 · 3D - by cr7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#1a1008;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:'Microsoft YaHei',Arial,sans-serif}
#wrap{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#3a3830,#282420,#1e1c18);border:4px solid #4a4440;border-radius:6px;box-shadow:0 0 0 3px #181410,0 0 0 7px #3a3630,0 0 0 10px #1a1410,0 10px 50px rgba(0,0,0,0.7)}
#wrap::before{content:'';display:block;height:6px;background:repeating-linear-gradient(45deg,#c83018 0,#c83018 8px,#d8a010 8px,#d8a010 16px);flex-shrink:0}
#bar{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;color:#c8c0a0;font-size:10px;background:#282420;flex-shrink:0;flex-wrap:wrap;gap:3px;border-bottom:2px solid #3a3020}
#bar b{color:#e04020;font-size:13px}
.life{display:inline-block;width:11px;height:11px;background:#e04020;margin:0 1px;border:1px solid #ff6040}
#bar button{pointer-events:auto;background:linear-gradient(180deg,#4a4030,#3a3020);color:#d0c8a0;border:1px solid #5a5040;padding:2px 8px;font-size:11px;cursor:pointer;border-radius:2px}
#lvl-t{color:#e04020;font-size:13px;font-weight:bold;cursor:pointer}
#bezel{flex:2;display:flex;flex-direction:column;padding:3px 6px 2px;background:#2a2822;border-bottom:3px solid #181410;position:relative;min-height:0}
#bezel::before{content:'';position:absolute;top:0;left:4px;right:4px;height:2px;background:linear-gradient(90deg,transparent,rgba(200,48,24,0.4),transparent)}
.scr-label{display:flex;justify-content:space-between;align-items:center;padding:0 4px 2px;color:rgba(200,160,100,0.4);font-size:8px;font-weight:bold;letter-spacing:1px;flex-shrink:0}
.scr-label .led{width:5px;height:5px;background:#e04020;box-shadow:0 0 6px #e04020;border-radius:50%}
.scr-label .led.on{background:#4f8;box-shadow:0 0 8px #4f8}
#game-screen{position:relative;flex:1;background:#1a1810;border:2px solid #2a2420;box-shadow:inset 0 0 15px rgba(0,0,0,0.5);overflow:hidden;min-height:0}
#game-screen canvas{display:block;width:100%;height:100%}
#screen-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#e04020;font-size:20px;font-weight:bold;text-align:center;text-shadow:0 0 18px #e04020;opacity:0;transition:opacity 0.25s}
#pu-bar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);color:#fc0;font-size:12px;font-weight:bold;text-shadow:0 0 8px #f80}
#eff-indicator{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:bold;text-align:center}
#mm{display:none;position:absolute;top:1%;right:1%;width:7%;aspect-ratio:1/1;border:1.5px solid #4a4030;border-radius:2px;z-index:8;pointer-events:none;image-rendering:pixelated}
#ctrl{position:relative;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;flex:1;background:linear-gradient(180deg,#282420,#1a1814);border-radius:0 0 4px 4px;border-top:1px solid #4a4030}
.stick{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(60,40,20,0.2),rgba(30,20,10,0.1));border:2px solid #5a4a30;position:relative;touch-action:none;box-shadow:inset 0 3px 12px rgba(0,0,0,0.5)}
.stick-th{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#a09070,#605040);border:2px solid #807060;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transition:transform 0.02s}
.brand{position:absolute;bottom:8px;right:16px;color:rgba(200,160,80,0.15);font-size:8px;font-weight:bold;letter-spacing:2px}
.fire{width:125px;height:125px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;touch-action:none;color:#fff;background:radial-gradient(circle at 40% 35%,#e03018,#901008);border:3px solid #c02010;box-shadow:0 0 18px rgba(240,40,20,0.3),0 3px 10px rgba(0,0,0,0.5)}
.fire:active{transform:scale(0.85)}
#over{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,6,2,0.94);z-index:30;flex-direction:column;justify-content:center;align-items:center;gap:16px}
#overmsg{color:#f44;font-size:26px;font-weight:bold;text-shadow:0 0 20px #f60}
#over button{background:#700;color:#fff;border:2px solid #f44;border-radius:4px;padding:12px 40px;font-size:18px;font-weight:bold;cursor:pointer}
#cbar{display:none;position:absolute;top:32px;left:0;right:0;z-index:35;flex-wrap:wrap;justify-content:center;gap:3px;padding:4px;background:rgba(10,6,2,0.92)}
#cbar button{background:#700;color:#fff;border:1px solid #f44;border-radius:3px;padding:2px 6px;font-size:10px;cursor:pointer}
#transition{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;z-index:50;pointer-events:none;opacity:0;transition:opacity 0.3s}
#transition.show{opacity:1}
#transition .lv{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#e04020;font-size:22px;font-weight:bold;text-shadow:0 0 20px #e04020;letter-spacing:3px;white-space:nowrap}
#splash{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#1a0000,#0a0000,#1a0000);z-index:60;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;pointer-events:auto}
#splash h1{color:#cc2222;font-size:30px;font-weight:900;letter-spacing:6px;margin:0;text-shadow:0 0 30px #cc2222,0 2px 0 #880000}
#splash .line{width:60%;height:2px;background:linear-gradient(90deg,transparent,#cc2222,transparent)}
#splash .diff-btn{color:#fff;border:1px solid #4a8a3a;padding:6px 14px;font-size:11px;cursor:pointer;border-radius:3px}
#splash button{background:transparent;color:#cc2222;border:2px solid #cc2222;padding:8px 32px;font-size:14px;font-weight:bold;cursor:pointer;letter-spacing:4px;text-transform:uppercase;transition:0.3s}
#splash button:hover{background:#cc2222;color:#fff}
#splash.hide{opacity:0;transition:opacity 0.5s;pointer-events:none}
</style>
</style>

      </div>
    </div>
  </div>
  <div id="ctrl">
    <div class="stick" id="st"><div class="stick-th" id="sth"></div></div>
    <span class="brand">☭ TANK BATTLE</span>
    <div class="fire" id="fire">FIRE</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

// ==================== CONSTANTS ====================
const CELL=48,COLS=13,ROWS=13;
const E=0,BK=1,ST=2,WT=3,FR=4,BS=5,IC=6,MD=7,GR=8;
const UP=0,DN=1,LT=2,RT=3;
const dx=[0,0,-1,1],dy=[-1,1,0,0];
const Mx=6,My=56,Mw=COLS*CELL,Mh=ROWS*CELL;
const MAP_CENTER=new THREE.Vector3(6.5,0,6.5);

// ==================== SCENE SETUP ====================
const gameScreen=document.getElementById('game-screen');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1810);

const camera=new THREE.PerspectiveCamera(55,gameScreen.clientWidth/Math.max(1,gameScreen.clientHeight),0.5,80);
camera.position.set(6.5,14,16);camera.lookAt(MAP_CENTER);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setSize(gameScreen.clientWidth,gameScreen.clientHeight);
gameScreen.insertBefore(renderer.domElement,gameScreen.firstChild);

scene.add(new THREE.AmbientLight(0x8a8878,0.8));
const sun=new THREE.DirectionalLight(0xffffff,1.1);
sun.position.set(15,22,8);sun.castShadow=true;
sun.shadow.mapSize.width=1024;sun.shadow.mapSize.height=1024;
sun.shadow.camera.near=0.5;sun.shadow.camera.far=80;
sun.shadow.camera.left=-18;sun.shadow.camera.right=18;
sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;
sun.shadow.bias=-0.0003;scene.add(sun);

// Ground
const groundPlane=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.MeshStandardMaterial({color:0x3a3020,roughness:0.95}));
groundPlane.rotation.x=-Math.PI/2;groundPlane.position.set(6.5,-0.05,6.5);groundPlane.receiveShadow=true;scene.add(groundPlane);

// Grid
const gridGroup=new THREE.Group(),gridMat=new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:1});
for(let c=0;c<=COLS;c++){const g=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.005,ROWS),gridMat);g.position.set(c,0.004,ROWS/2);gridGroup.add(g);}
for(let r=0;r<=ROWS;r++){const g=new THREE.Mesh(new THREE.BoxGeometry(COLS,0.005,0.04),gridMat);g.position.set(COLS/2,0.004,r);gridGroup.add(g);}
scene.add(gridGroup);

// ==================== GEOMETRIES ====================
const BODY_GEO=new THREE.BoxGeometry(0.72,0.44,0.84);
const TRACK_GEO=new THREE.BoxGeometry(0.22,0.32,0.78);
const TURRET_GEO=new THREE.BoxGeometry(0.5,0.3,0.5);
const BARREL_GEO=new THREE.BoxGeometry(0.17,0.17,0.56);
const MUZZLE_GEO=new THREE.BoxGeometry(0.11,0.11,0.13);
const TURRET_L3=new THREE.BoxGeometry(0.56,0.34,0.56);
const BARREL_L3=new THREE.BoxGeometry(0.2,0.2,0.7);
const MUZZLE_L3=new THREE.BoxGeometry(0.14,0.14,0.16);
const TURRET_L5=new THREE.BoxGeometry(0.64,0.4,0.64);
const BARREL_L5=new THREE.BoxGeometry(0.18,0.18,0.6);
const MUZZLE_L5=new THREE.BoxGeometry(0.13,0.13,0.14);
const BULLET_GEO=new THREE.SphereGeometry(0.1,8,6);
const BRICK_GEO=new THREE.BoxGeometry(0.94,0.9,0.94);
const FLAT_GEO=new THREE.BoxGeometry(1,0.1,1);
const BASE_GEO=new THREE.BoxGeometry(0.8,0.8,0.8);

const ENEMY_GEOS={
  basic:{body:new THREE.BoxGeometry(0.66,0.4,0.76),track:new THREE.BoxGeometry(0.2,0.28,0.7),turret:new THREE.BoxGeometry(0.44,0.26,0.44),barrel:new THREE.BoxGeometry(0.14,0.14,0.5),muzzle:new THREE.BoxGeometry(0.09,0.09,0.11)},
  fast:{body:new THREE.BoxGeometry(0.6,0.32,0.9),track:new THREE.BoxGeometry(0.18,0.24,0.84),turret:new THREE.BoxGeometry(0.4,0.22,0.4),barrel:new THREE.BoxGeometry(0.12,0.12,0.6),muzzle:new THREE.BoxGeometry(0.08,0.08,0.1)},
  power:{body:new THREE.BoxGeometry(0.78,0.48,0.82),track:new THREE.BoxGeometry(0.24,0.36,0.76),turret:new THREE.BoxGeometry(0.54,0.34,0.54),barrel:new THREE.BoxGeometry(0.2,0.2,0.66),muzzle:new THREE.BoxGeometry(0.14,0.14,0.15)},
  armor:{body:new THREE.BoxGeometry(0.8,0.5,0.8),track:new THREE.BoxGeometry(0.26,0.38,0.74),turret:new THREE.BoxGeometry(0.58,0.36,0.58),barrel:new THREE.BoxGeometry(0.18,0.18,0.5),muzzle:new THREE.BoxGeometry(0.12,0.12,0.12)},
  boss:{body:new THREE.BoxGeometry(0.9,0.56,0.95),track:new THREE.BoxGeometry(0.28,0.42,0.88),turret:new THREE.BoxGeometry(0.66,0.42,0.66),barrel:new THREE.BoxGeometry(0.24,0.24,0.75),muzzle:new THREE.BoxGeometry(0.16,0.16,0.18)},
};

// ==================== TERRAIN SYSTEM ====================
let terrainObjects=[],waterTiles=[];

function clearTerrain(){for(const t of terrainObjects){if(t.obj&&t.obj.parent)t.obj.parent.remove(t.obj);}terrainObjects=[];waterTiles.length=0;}

function addFlatTile(x,z){
  const m=new THREE.Mesh(FLAT_GEO,new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:0.9}));
  m.position.set(x+0.5,0.05,z+0.5);m.receiveShadow=true;
  scene.add(m);terrainObjects.push({obj:m,col:x,row:z,type:'ground'});
}

function addBrick(x,z){
  const g=new THREE.Group();
  const main=new THREE.Mesh(BRICK_GEO,new THREE.MeshStandardMaterial({color:0xc05030,roughness:0.65}));
  main.position.y=0.45;main.name='brick-body';main.castShadow=true;main.receiveShadow=true;g.add(main);
  const lGeo=new THREE.BoxGeometry(0.96,0.04,0.96),lMat=new THREE.MeshStandardMaterial({color:0x8b6040,roughness:0.9});
  [0.15,0.45,0.75].forEach(y=>{const l=new THREE.Mesh(lGeo,lMat);l.name='mortar';l.position.y=y;g.add(l);});
  g.position.set(x+0.5,0,z+0.5);scene.add(g);
  terrainObjects.push({obj:g,col:x,row:z,type:'brick'});
}

// Load sn.png texture for steel walls
let steelTex=null;
const texLoader=new THREE.TextureLoader();
texLoader.load('sn.png',function(tex){
  steelTex=tex;steelTex.wrapS=steelTex.wrapT=THREE.RepeatWrapping;
  steelTex.magFilter=steelTex.minFilter=THREE.NearestFilter;
  steelTex.colorSpace=THREE.SRGBColorSpace;
  // Update all existing steel bodies
  terrainObjects.forEach(t=>{if(t.type==='steel'){t.obj.children.forEach(ch=>{if(ch.name==='steel-body'&&ch.material){ch.material.map=steelTex;ch.material.needsUpdate=true;}});}});
},undefined,()=>{});

function addSteel(x,z){
  const g=new THREE.Group();
  const layerH=0.3,size=0.92;
  const ssMat=new THREE.MeshStandardMaterial({map:steelTex,color:steelTex?0xcccccc:0xd0c8b8,roughness:steelTex?0.5:0.6,metalness:0.05});
  const darkMat=new THREE.MeshStandardMaterial({map:steelTex,color:steelTex?0xbbbbbb:0xc0b8a8,roughness:steelTex?0.55:0.65,metalness:0.05});
  // 3 horizontal layers of stainless steel
  for(let layer=0;layer<3;layer++){
    const ly=layer*layerH+layerH/2;
    const mat=layer===1?darkMat:ssMat; // middle layer slightly darker for contrast
    const block=new THREE.Mesh(new THREE.BoxGeometry(size,layerH-0.03,size),mat);
    block.position.y=ly;block.castShadow=true;block.receiveShadow=true;block.name='steel-body';
    g.add(block);
    // Layer seam highlight
    if(layer<2){
      const seam=new THREE.Mesh(new THREE.BoxGeometry(size,0.015,size),
        new THREE.MeshStandardMaterial({color:0xfafcfd,roughness:0.04,metalness:0.95}));
      seam.position.y=ly+layerH/2;g.add(seam);
    }
    // Rivets at corners of each layer
    const rivMat=new THREE.MeshStandardMaterial({color:0x999080,roughness:0.5,metalness:0.1});
    [[-0.38,0.38],[-0.38,-0.38],[0.38,0.38],[0.38,-0.38]].forEach(([rx,rz])=>{
      const rivet=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.02,6),rivMat);
      rivet.position.set(rx,ly+layerH/2-0.04,rz);rivet.rotation.x=Math.PI/2;g.add(rivet);
    });
  }
  // Top plate
  const top=new THREE.Mesh(new THREE.BoxGeometry(size,0.03,size),
    new THREE.MeshStandardMaterial({map:steelTex,color:steelTex?0xcccccc:0xc8c0b0,roughness:0.5,metalness:0.05}));
  top.position.y=0.9;g.add(top);
  g.position.set(x+0.5,0,z+0.5);scene.add(g);
  terrainObjects.push({obj:g,col:x,row:z,type:'steel'});
}

function addWater(x,z){
  const g=new THREE.Group();
  // Water base — flush with ground
  const baseGeo=new THREE.BoxGeometry(0.96,0.18,0.96);
  const base=new THREE.Mesh(baseGeo,new THREE.MeshStandardMaterial({color:0x1133aa,roughness:0.08,metalness:0.05,transparent:true,opacity:0.65}));
  base.position.y=0.09;base.receiveShadow=true;g.add(base);
  // Wavy surface — flush with road
  const segs=8,size=0.94;
  const surfGeo=new THREE.PlaneGeometry(size,size,segs,segs);
  const positions=surfGeo.attributes.position.array;
  const waves=[];
  for(let i=0;i<positions.length;i+=3){
    const vx=positions[i],vy=positions[i+1];
    const wave=Math.sin(vx*4)*Math.cos(vy*3.5)*0.04+Math.sin(vx*7+vy*5)*0.03;
    positions[i+2]=wave;
    waves.push({baseZ:wave,origX:vx,origY:vy});
  }
  surfGeo.computeVertexNormals();
  const surfMat=new THREE.MeshStandardMaterial({color:0x3388dd,roughness:0.05,metalness:0.25,transparent:true,opacity:0.55,side:THREE.DoubleSide});
  const surf=new THREE.Mesh(surfGeo,surfMat);
  surf.rotation.x=-Math.PI/2;surf.position.y=0.11;surf.name='surface';
  g.add(surf);
  g.position.set(x+0.5,0,z+0.5);scene.add(g);
  terrainObjects.push({obj:g,col:x,row:z,type:'water'});
  waterTiles.push({mesh:surf,positions,waves,phase:Math.random()*Math.PI*2});
}

function addIce(x,z){
  const g=new THREE.Group();
  // Ice pyramid — four-sided cone, 0.5 tall
  const iceGeo=new THREE.ConeGeometry(0.45,0.5,4);
  const iceMat=new THREE.MeshStandardMaterial({color:0xd8f0ff,roughness:0.08,metalness:0.25,transparent:true,opacity:0.75});
  const pyramid=new THREE.Mesh(iceGeo,iceMat);
  pyramid.position.y=0.25;pyramid.castShadow=true;pyramid.receiveShadow=true;g.add(pyramid);
  // Second smaller crystal
  const smallGeo=new THREE.ConeGeometry(0.22,0.3,4);
  const small=new THREE.Mesh(smallGeo,iceMat);
  small.position.set(0.2,0.15,-0.2);small.rotation.y=Math.PI/4;small.castShadow=true;g.add(small);
  // Sparkle dots
  const sparkMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.5,depthWrite:false});
  for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.03,0.03),sparkMat);s.position.set((Math.random()-0.5)*0.5,0.15+Math.random()*0.3,(Math.random()-0.5)*0.5);g.add(s);}
  g.position.set(x+0.5,0,z+0.5);scene.add(g);
  terrainObjects.push({obj:g,col:x,row:z,type:'ice'});
}

function addMud(x,z){
  const m=new THREE.Mesh(FLAT_GEO,new THREE.MeshStandardMaterial({color:0x4a3828,roughness:0.95}));
  m.position.set(x+0.5,0.05,z+0.5);m.receiveShadow=true;
  scene.add(m);terrainObjects.push({obj:m,col:x,row:z,type:'mud'});
}
function addGrass(x,z){
  const g=new THREE.Group();
  // Base matches ground tile color
  const base=new THREE.Mesh(FLAT_GEO,new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:0.9}));
  base.position.y=0.05;base.receiveShadow=true;g.add(base);
  // Grass tufts — tall green blocks, ≥ half brick height (0.45)
  const tuftMat=new THREE.MeshStandardMaterial({color:0x4a8a28,roughness:0.55});
  for(let i=0;i<6;i++){
    const tx=(Math.random()-0.5)*0.7,tz=(Math.random()-0.5)*0.7;
    const th=0.45+Math.random()*0.4;
    const tuft=new THREE.Mesh(new THREE.BoxGeometry(0.06+Math.random()*0.06,th,0.06+Math.random()*0.06),tuftMat);
    tuft.position.set(tx,th/2+0.05,tz);tuft.castShadow=true;g.add(tuft);
  }

// Fence
function createFence(){
  const fg=new THREE.Group();
  const postMat=new THREE.MeshStandardMaterial({color:0x5a5a4a,roughness:0.6,metalness:0.5});
  const wireMat=new THREE.MeshStandardMaterial({color:0x7a7a6a,roughness:0.4,metalness:0.7});
  const offset=0.35;
  [{axis:'x',fixed:-offset,from:0,to:COLS},{axis:'x',fixed:ROWS+offset,from:0,to:COLS},{axis:'z',fixed:-offset,from:0,to:ROWS},{axis:'z',fixed:COLS+offset,from:0,to:ROWS}].forEach(edge=>{
    const posts=Math.ceil(edge.to-edge.from)+1;
    for(let i=0;i<posts;i++){
      const t=edge.from+(i/(posts-1))*(edge.to-edge.from);
      const px=edge.axis==='x'?t:edge.fixed,pz=edge.axis==='z'?t:edge.fixed;
      const post=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,1.0,6),postMat);
      post.position.set(px,0.5,pz);post.castShadow=true;post.receiveShadow=true;fg.add(post);
      const cap=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.15,6),postMat);
      cap.position.set(px,1.05,pz);cap.castShadow=true;fg.add(cap);
    }
    for(let strand=0;strand<3;strand++){
      const wy=0.25+strand*0.35,wlen=edge.to-edge.from;
      const w=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,wlen,6),wireMat);
      if(edge.axis==='x'){w.position.set(edge.from+wlen/2,wy,edge.fixed);w.rotation.z=Math.PI/2;}
      else{w.position.set(edge.fixed,wy,edge.from+wlen/2);w.rotation.x=Math.PI/2;}
      fg.add(w);
    }
  });
  // Corner lamp posts with point lights
  const lampMat=new THREE.MeshStandardMaterial({color:0x4a4a44,roughness:0.4,metalness:0.7});
  [[-offset,-offset],[-offset,COLS+offset],[COLS+offset,-offset],[COLS+offset,COLS+offset]].forEach(([cx,cz])=>{
    const cp=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.2,8),postMat);
    cp.position.set(cx,0.6,cz);cp.castShadow=true;cp.receiveShadow=true;fg.add(cp);
    const cc=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.2,8),postMat);
    cc.position.set(cx,1.25,cz);cc.castShadow=true;fg.add(cc);
    // Lamp pole extension
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,0.5,8),lampMat);
    pole.position.set(cx,1.4,cz);pole.castShadow=true;fg.add(pole);
    // Lamp housing
    const housing=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.1,0.15),lampMat);
    housing.position.set(cx,1.68,cz);fg.add(housing);
    // Glow sphere
    const glow=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),
      new THREE.MeshBasicMaterial({color:0xffffcc}));
    glow.position.set(cx,1.68,cz);fg.add(glow);
    // Point light
    const light=new THREE.PointLight(0xffeedd,3,4);
    light.position.set(cx,1.65,cz);fg.add(light);
  });
  scene.add(fg);
}

// Terrain update
function buildTerrain(){
  clearTerrain();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    addFlatTile(c,r);const t=G.map[r][c];
    if(t===BK)addBrick(c,r);else if(t===ST)addSteel(c,r);else if(t===WT)addWater(c,r);
    else if(t===IC)addIce(c,r);else if(t===MD)addMud(c,r);else if(t===FR)addForest(c,r);
    else if(t===BS)addBase(c,r);else if(t===GR)addGrass(c,r);
  }
}
function updateTerrainCell(c,r){
  for(let i=terrainObjects.length-1;i>=0;i--){
    if(terrainObjects[i].col===c&&terrainObjects[i].row===r&&terrainObjects[i].type!=='ground'){
      if(terrainObjects[i].obj.parent)terrainObjects[i].obj.parent.remove(terrainObjects[i].obj);
      terrainObjects.splice(i,1);
    }
  }
  const t=G.map[r][c];
  if(t===BK)addBrick(c,r);else if(t===ST)addSteel(c,r);else if(t===BS)addBase(c,r);
  else if(t===IC)addIce(c,r);else if(t===WT)addWater(c,r);else if(t===GR)addGrass(c,r);
}
function updateBrickCracks(c,r){
  const hp=G.tileHp[r][c];
  const brick=terrainObjects.find(t=>t.col===c&&t.row===r&&t.type==='brick');
  if(!brick||!brick.obj)return;
  const g=brick.obj;
  for(let i=g.children.length-1;i>=0;i--){const ch=g.children[i];if(ch.name==='crack'||ch.name==='mortar'||ch.name==='top-cap')g.remove(ch);}
  if(hp<=0)return;
  const body=g.children.find(ch=>ch.name==='brick-body');
  const fullH=0.9,scale=hp/3,bodyY=fullH*scale/2;
  if(body){body.scale.y=scale;body.position.y=bodyY;if(body.material)body.material.color.setHex(hp===2?0xb04828:hp===1?0x803018:0xc05030);}
  if(hp>=2){const mGeo=new THREE.BoxGeometry(0.96,0.04,0.96),mMat=new THREE.MeshStandardMaterial({color:0x8b6040,roughness:0.9});for(let s=1;s<hp;s++){const m=new THREE.Mesh(mGeo,mMat);m.name='mortar';m.position.y=s*fullH/3;g.add(m);}}
  const cap=new THREE.Mesh(new THREE.BoxGeometry(0.94,0.04,0.94),new THREE.MeshStandardMaterial({color:0xc05030,roughness:0.65}));
  cap.name='top-cap';cap.position.y=fullH*scale;g.add(cap);
  const S=0.48,crMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.85,depthTest:true,depthWrite:false});
  const cy=fullH*scale*0.5;
  if(hp===2){
    const c1=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.035,0.035),crMat);c1.name='crack';c1.position.set(-0.02,cy+0.05,S);c1.rotation.z=0.35;g.add(c1);
    const c2=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.03,0.03),crMat);c2.name='crack';c2.position.set(0.14,cy-0.05,S);c2.rotation.z=-0.5;g.add(c2);
  }else if(hp===1){
    [[[0.6,0.035,0.035],[0,cy,S],[0,0,0.35]],[[0.4,0.03,0.03],[-0.06,cy-0.02,S],[0,0,-0.5]],[[0.35,0.03,0.03],[0.12,cy+0.04,S],[0,0,0.6]],[[0.035,0.035,0.35],[S,cy,0],[0,0,0]],[[0.5,0.035,0.035],[0.04,cy-0.08,S],[0,0,0.2]]].forEach(([gs,ps,rs])=>{
      const m=new THREE.Mesh(new THREE.BoxGeometry(...gs),crMat);m.name='crack';m.position.set(...ps);
      if(rs[0])m.rotation.x=rs[0];if(rs[1])m.rotation.y=rs[1];if(rs[2])m.rotation.z=rs[2];g.add(m);
    });
  }
}
function updateSteelCracks(c,r){
  const hp=G.tileHp[r][c];
  const steel=terrainObjects.find(t=>t.col===c&&t.row===r&&t.type==='steel');
  if(!steel||!steel.obj)return;const g=steel.obj;
  for(let i=g.children.length-1;i>=0;i--){if(g.children[i].name==='crack'||g.children[i].name==='top-cap')g.remove(g.children[i]);}
  if(hp<=0)return;
  // Scale each steel-body layer down based on HP (same as bricks)
  const scale=hp/3;
  g.children.forEach(ch=>{
    if(ch.name==='steel-body'){ch.scale.y=scale;ch.position.y=ch.position.y*scale;}
  });
  // Darken
  g.children.forEach(ch=>{if(ch.name==='steel-body'&&ch.material)ch.material.color.setHex(hp===1?0xbcc0c4:0xd4d8dc);});
  // Top cap with sn.png texture
  const capGeo=new THREE.BoxGeometry(0.92,0.04,0.92);
  const capMat=new THREE.MeshStandardMaterial({map:steelTex,color:steelTex?0xcccccc:0xd0c8b8,roughness:0.5,metalness:0.05});
  const cap=new THREE.Mesh(capGeo,capMat);cap.name='top-cap';
  cap.position.y=0.9*scale;g.add(cap);
  // Cracks on remaining surface — same style as bricks
  const S=0.47,crMat=new THREE.MeshBasicMaterial({color:0x111111,transparent:true,opacity:0.85,depthTest:true,depthWrite:false});
  const cy=0.9*scale*0.5;
  if(hp===1){
    const cracks=[[[0.6,0.035,0.035],[0,cy,S],[0,0,0.35]],[[0.4,0.03,0.03],[-0.06,cy-0.02,S],[0,0,-0.5]],[[0.35,0.03,0.03],[0.12,cy+0.04,S],[0,0,0.6]],[[0.035,0.035,0.35],[S,cy,0],[0,0,0]],[[0.5,0.035,0.035],[0.04,cy-0.08,S],[0,0,0.2]]];
    for(const[gs,ps,rs]of cracks){const m=new THREE.Mesh(new THREE.BoxGeometry(...gs),crMat);m.name='crack';m.position.set(...ps);if(rs[0])m.rotation.x=rs[0];if(rs[1])m.rotation.y=rs[1];if(rs[2])m.rotation.z=rs[2];g.add(m);}
  }
}

// Track marks
let trackMarks=[];
function addTrackMark(x,y,dir){
  const wx=x/CELL,wz=y/CELL;
  const perpX=[0,0,-1,1][dir],perpZ=[1,-1,0,0][dir];
  const markGeo=new THREE.PlaneGeometry(0.12,0.06);
  const markMat=new THREE.MeshBasicMaterial({color:0x1a1008,transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false});
  for(let side=-1;side<=1;side+=2){
    const m=new THREE.Mesh(markGeo,markMat.clone());
    m.rotation.x=-Math.PI/2;m.position.set(wx+perpX*side*0.25,0.06,wz+perpZ*side*0.25);
    m.userData={life:90+Math.random()*30};scene.add(m);trackMarks.push(m);
  }
}
function updateTrackMarks(){
  for(let i=trackMarks.length-1;i>=0;i--){
    const m=trackMarks[i];m.userData.life--;
    if(m.material)m.material.opacity=0.5*(m.userData.life/120);
    if(m.userData.life<=0){scene.remove(m);trackMarks.splice(i,1);}
  }
}

    // Nose cone (spinner)
    const nose=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.2,8),fm);
    nose.rotation.z=-Math.PI/2;nose.position.set(0.9,0,0);g.add(nose);
    // Propeller
    const prop=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.5,0.06),
      new THREE.MeshStandardMaterial({color:0x222,roughness:0.3}));
    prop.position.set(1.0,0,0);g.add(prop);
    // Cockpit
    const cockpit=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.08,0.12),
      new THREE.MeshStandardMaterial({color:0x88aacc,roughness:0.1,metalness:0.6}));
    cockpit.position.set(0.5,0.1,0);g.add(cockpit);
    // Wings
    const wing=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.03,2.0),wm2);
    wing.position.set(0.1,0,0);g.add(wing);
    // Tail
    const tailV=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.2,0.05),fm);
    tailV.position.set(-0.7,0.12,0);g.add(tailV);
    const tailH=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.03,0.7),wm2);
    tailH.position.set(-0.75,0.07,0);g.add(tailH);
    g.userData={isBomber:false,propeller:prop};
  }
  // Fly right across sky
  g.position.set(-5,7+Math.random()*2,1.5+Math.random()*10);
  g.rotation.y=0;
  g.userData.speed=0.025+Math.random()*0.03;
  scene.add(g);aircraft.push(g);
}
function updateAircraft(){
  for(let i=aircraft.length-1;i>=0;i--){
    const a=aircraft[i];a.position.x+=a.userData.speed;
    if(a.userData.propeller)a.userData.propeller.rotation.z+=0.5;
    // Aircraft engine sound
    if(a.userData.isBomber&&G.fc%6===0)bp(55+Math.random()*15,0.2,'sawtooth',0.06);
    else if(!a.userData.isBomber&&G.fc%3===0)bp(150+Math.random()*40,0.1,'sawtooth',0.04);
    // Bomber drops 2 items when over map center
    if(a.userData.isBomber&&!a.userData.dropTriggered&&a.position.x>3&&a.position.x<9){
      a.userData.dropTriggered=true;
      for(let d=0;d<2;d++){
        let dc,dr,attempts=0;
        do{dc=2+Math.floor(Math.random()*9);dr=2+Math.floor(Math.random()*9);attempts++;}
        while(attempts<20&&G.map[dr][dc]!==E);
        airdropItem(dc+0.5,dr+0.5,a.position.y,dc,dr);
      }
    }
    if(a.position.x>18){scene.remove(a);aircraft.splice(i,1);}
  }
  // Update parachutes
  for(let i=parachutes.length-1;i>=0;i--){
    const p=parachutes[i];
    if(p.userData.landed){
      p.userData.fade-=0.03;
      if(p.userData.fade<=0){scene.remove(p);parachutes.splice(i,1);}
    }else{
      p.position.y-=0.035;
      if(p.position.y<=0.25){p.position.y=0.25;p.userData.landed=true;p.userData.fade=1.5;
        const tc=p.userData.targetCol,tr=p.userData.targetRow;
        const px=tc*CELL+CELL/2,py=tr*CELL+CELL/2;
        if(p.userData.dropType==='tank'){
          const types=['basic','fast','power','armor'];const ty=types[Math.floor(Math.random()*4)];
          const e=new Tank(px,py,DN,false);e.ty=ty;e.spn=false;e.spnT=0;
          G.enemies.push(e);G.eos++;G.er++;e._syncModel();e._updatePos();
        }else{G.powerUps.push(new PowerUp(px,py,['star','bomb','clock','shield','speed','rapid'][Math.floor(Math.random()*6)]));}
        uu();
      }
    }
  }
}
function airdropItem(wx,wz,ay,tc,tr){
  const isTank=Math.random()<0.7;
  const g=new THREE.Group();
  g.userData={landed:false,fade:0,dropType:isTank?'tank':'powerup',chute:null,tankModel:null,puModel:null,targetCol:tc,targetRow:tr};
  // Parachute canopy
  const chute=new THREE.Mesh(new THREE.ConeGeometry(0.35,0.3,8),
    new THREE.MeshStandardMaterial({color:isTank?0xcc3333:0xffcc00,roughness:0.4,side:THREE.DoubleSide}));
  chute.position.y=0.55;g.add(chute);
  // Mini tank or crate hanging
  let tankModel=null,puModel=null;
  if(isTank){
    tankModel=new THREE.Group();
    const tHex=new THREE.Color(ENEMY_COLORS[['basic','fast','power','armor'][Math.floor(Math.random()*4)]]||'#e0e0e8');
    const tm=new THREE.MeshStandardMaterial({color:tHex,roughness:0.4,metalness:0.2});
    const tb=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.15,0.3),tm);tb.position.y=0.08;tankModel.add(tb);
    const tt=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.12,0.18),tm);tt.position.y=0.2;tankModel.add(tt);
    const tbar=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.2),
      new THREE.MeshStandardMaterial({color:0xd8d8e0,roughness:0.15,metalness:0.85}));
    tbar.position.set(0,0.2,0.18);tankModel.add(tbar);
    tankModel.position.y=0;g.add(tankModel);
  }else{
    puModel=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.22,0.22),
      new THREE.MeshStandardMaterial({color:0xffcc00,roughness:0.3,emissive:0xffaa00,emissiveIntensity:0.4}));
    puModel.position.y=0.11;g.add(puModel);
  }
  // Ropes
  const ropeMat=new THREE.MeshBasicMaterial({color:0x888});
  for(let ri=0;ri<4;ri++){const r=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.35,4),ropeMat);r.position.set(Math.cos(ri*Math.PI/2)*0.16,0.35,Math.sin(ri*Math.PI/2)*0.16);g.add(r);}
  g.position.set(wx,ay-0.5,wz);
  g.userData.chute=chute;g.userData.tankModel=tankModel;g.userData.puModel=puModel;
  scene.add(g);parachutes.push(g);
}

// ==================== MINIMAP ====================
const mmCanvas=document.getElementById('mm'),mmCtx=mmCanvas.getContext('2d');
function drawMinimap(){
  const SZ=8,W=104;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=G.map[r][c];let col='#3a3020';if(t===BK)col='#c05030';else if(t===ST)col='#b8b0a0';else if(t===WT)col='#25d';else if(t===IC)col='#adf';else if(t===MD)col='#4a3828';else if(t===FR)col='#2d5a1e';else if(t===BS)col='#fd0';else if(t===GR)col='#4a8a28';mmCtx.fillStyle=col;mmCtx.fillRect(c*SZ,r*SZ,SZ,SZ);}
  // Enemy dots
  for(const e of G.enemies){if(e.spn||e._dead)continue;const ex=(e.x/CELL)/13*W,ez=(e.y/CELL)/13*W;mmCtx.fillStyle=e.ft>0?'#ff0':'#f44';mmCtx.beginPath();mmCtx.arc(ex,ez,2.5,0,Math.PI*2);mmCtx.fill();}
  // Player dot
  if(G.player&&!G.player.spn){const px=(G.player.x/CELL)/13*W,pz=(G.player.y/CELL)/13*W;mmCtx.fillStyle='#0f0';mmCtx.beginPath();mmCtx.arc(px,pz,3.5,0,Math.PI*2);mmCtx.fill();mmCtx.strokeStyle='#000';mmCtx.lineWidth=0.5;mmCtx.stroke();}
}

// ==================== RESIZE ====================
function resize(){const w=gameScreen.clientWidth,h=gameScreen.clientHeight;if(w===0||h===0)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
window.addEventListener('resize',resize);

// ==================== CAMERA ====================
function updateCamera(){
  if(G.camMode==='follow'&&G.player&&!G.player.spn){const px=G.player.x/CELL,pz=G.player.y/CELL;camera.position.set(px,7,pz+5);camera.lookAt(px,0,pz-2);}
  else{const aspect=Math.max(0.5,camera.aspect),mapHalf=8.5,vFovHalf=(camera.fov/2)*Math.PI/180,hFovHalf=Math.atan(Math.tan(vFovHalf)*aspect),eff=Math.min(vFovHalf,hFovHalf),dist=mapHalf/Math.tan(eff);camera.position.set(6.5,dist*0.75,6.5+dist*0.6);camera.lookAt(MAP_CENTER);}
  if(G.sht>0){camera.position.x+=(Math.random()-0.5)*G.si*0.04;camera.position.y+=(Math.random()-0.5)*G.si*0.04;camera.position.z+=(Math.random()-0.5)*G.si*0.04;}
}
function animateEagle(){const b=terrainObjects.find(t=>t.type==='base');if(!b||!b.obj||!b.obj.userData.leftWing)return;const leftWing=b.obj.userData.leftWing,rightWing=b.obj.userData.rightWing;const flap=Math.sin(G.fc*0.06)*0.35;leftWing.rotation.z=flap;rightWing.rotation.z=-flap;}
function animateWater(){for(const wt of waterTiles){const t=G.fc*0.03+wt.phase;const pos=wt.mesh.geometry.attributes.position.array;for(let i=0;i<pos.length;i+=3){const w=wt.waves[i/3];pos[i+2]=w.baseZ+Math.sin(t+w.origX*2)*0.03+Math.cos(t*1.3+w.origY*2.5)*0.02;}wt.mesh.geometry.attributes.position.needsUpdate=true;wt.mesh.geometry.computeVertexNormals();}}

// ==================== GAME LOOP ====================
function update(){
  if(G.paused||G.lc||G.go)return;G.fc++;um();
  if(G.pi>0)G.pi--;if(G.ef>0)G.ef--;if(G.bf>0){G.bf--;if(G.bf<=0)rs();}if(G.sht>0)G.sht--;
  if(G.speedBoost>0)G.speedBoost--;if(G.rapidFire>0)G.rapidFire--;if(G.comboTimer>0){G.comboTimer--;if(G.comboTimer<=0)G.comboCount=0;}
  if(G.player)G.player.update();if(G.fc%900===0)spawnAircraft();if(G.es<20&&G.eos<G.mos){G.st--;if(G.st<=0)se();}
  for(const e of G.enemies)e.update();for(const b of G.bullets)b.update();
  for(let i=0;i<G.bullets.length;i++)for(let j=i+1;j<G.bullets.length;j++)if(G.bullets[i].alive&&G.bullets[j].alive&&G.bullets[i].ip!==G.bullets[j].ip&&Math.abs(G.bullets[i].x-G.bullets[j].x)<6&&Math.abs(G.bullets[i].y-G.bullets[j].y)<6){G.bullets[i].alive=false;G.bullets[j].alive=false;sp3D(G.bullets[i].x,G.bullets[i].y,'#ff0',12);}
  for(let i=G.bullets.length-1;i>=0;i--){if(!G.bullets[i].alive){G.bullets[i].destroy();G.bullets.splice(i,1);}}
  for(const p of G.powerUps)p.update();G.powerUps=G.powerUps.filter(p=>p.alive!==false);
  updateParticles();updateTrackMarks();updateExhaust();if(!G.go&&!G.lc&&G.er<=0&&G.eos<=0&&G.es>=20)lc_();uu();
}
function render(){
  animateEagle();animateWater();updateAircraft();updateWeather();animateSpawnHatches();
  if(G.ef>0)scene.background=new THREE.Color(0x1a2a3a);
  else if(G.weather===0)scene.background=new THREE.Color(0x1a1810);
  else if(G.weather===1)scene.background=new THREE.Color(0x1a1a20);
  else if(G.weather===2||G.weather===3)scene.background=new THREE.Color(0x222233);
  else if(G.weather===4)scene.background=new THREE.Color(0x1a1a22);
  else scene.background=new THREE.Color(0x1a1810);
  renderer.render(scene,camera);
  if(G.camMode==='follow'){mmCanvas.style.display='block';drawMinimap();}else mmCanvas.style.display='none';
}
function loop(){update();updateCamera();render();requestAnimationFrame(loop);}

// ==================== INIT ====================
createFence();createSpawnHatches();sl();render(); // show initial frame but don't start loop
document.querySelectorAll('.diff-btn').forEach(b=>{
  const startGame=(d)=>{ia();G.difficulty=d;G.mos=3+d;G.sd=120-d*30;G.er=20+d*4;
    document.getElementById('splash').classList.add('hide');levelTransition(0,()=>{loop();});
    setTimeout(()=>{const s=document.getElementById('splash');if(s)s.remove();},600);
  };
  b.onclick=function(){startGame(parseInt(this.dataset.d));};
  b.addEventListener('touchstart',e=>{e.preventDefault();startGame(parseInt(e.target.dataset.d));});
});
document.getElementById('start-btn').onclick=function(){
  ia();G.difficulty=0;G.mos=3;G.sd=120;G.er=20;document.getElementById('splash').classList.add('hide');levelTransition(0,()=>{loop();});
  setTimeout(()=>{const s=document.getElementById('splash');if(s)s.remove();},600);
};
document.getElementById('start-btn').addEventListener('touchstart',e=>{e.preventDefault();ia();G.difficulty=0;G.mos=3;G.sd=120;G.er=20;document.getElementById('splash').classList.add('hide');levelTransition(0,()=>{loop();});setTimeout(()=>{const s=document.getElementById('splash');if(s)s.remove();},600);});
</script>
